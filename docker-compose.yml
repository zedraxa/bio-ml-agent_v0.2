version: '3.8'

services:
  # 1) Redis: In-memory Task Queue & Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: always

  # 2) FastAPI Backend Server
  api:
    build: .
    ports:
      - "8001:8001" # Host and container both on 8001
    volumes:
      - ./workspace:/app/workspace
      - ./logs:/app/logs
      - ./mlflow_logs:/app/mlflow_logs
      - ./db:/app/db
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - mlflow
    command: python3 api_server.py

  # 3) RQ Background Worker (Swarm Executer)
  worker:
    build: .
    volumes:
      - ./workspace:/app/workspace
      - ./logs:/app/logs
      - ./mlflow_logs:/app/mlflow_logs
      - ./db:/app/db
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    security_opt:
      # S9-1 Container Hardening
      - no-new-privileges:true
      # Docker'ın varsayılan seccomp profili kullanılıyor (güvenli)
      # Üretim ortamında özel bir seccomp profili tanımlanabilir
    depends_on:
      - redis
    command: rq worker agent_tasks -u redis://redis:6379

  # 4) Gradio Web UI
  web_ui:
    build: .
    ports:
      - "7860:7860" # Gradio default port
    volumes:
      - ./workspace:/app/workspace
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: python3 web_ui.py

  # 5) MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    ports:
      - "5005:5000"
    volumes:
      - ./mlflow_logs:/mlflow
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts

  # 6) LiteLLM Proxy
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    env_file:
      - .env

  # 7) Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  # 8) PostgreSQL Relational DB (Users, Roles, Projects)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=agent_user
      - POSTGRES_PASSWORD=agent_pass
      - POSTGRES_DB=bio_ml_agent
    volumes:
      - ./pg_data:/var/lib/postgresql/data

  # 9) MinIO Object Storage (Cloud Artifacts)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminpassword
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  # 10) OpenTelemetry Collector (Observability)
  otel_collector:
    image: otel/opentelemetry-collector:latest
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  # 11) API Gateway (Secure Remote Gateway)
  gateway:
    build: .
    ports:
      - "8000:8000" # Dış dünyaya açık ana port
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - api
      - redis
    command: python3 gateway_server.py

  # 12) Notification & Event Worker
  notification_worker:
    build: .
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    command: rq worker notifications -u redis://redis:6379

networks:
  default:
    name: bio-ml-network

