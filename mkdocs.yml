site_name: Bio-ML Agent Documentation
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - content.code.copy

nav:
  - Ana Sayfa: index.md
  - Mimari: architecture.md
  - RAG Sistemi: rag.md
  - API Referansı: api.md
  - Katkıda Bulunma: contributing_guide.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
