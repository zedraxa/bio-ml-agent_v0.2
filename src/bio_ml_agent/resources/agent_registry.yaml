# Bio-ML Agent Family Registry (V1.0)
# Structure: agent_id, path, family, capability, tier, mission_pack, artifact_type

agents:
  # --- ACADEMIC FAMILY (BETA) ---
  - agent_id: abstract_generator
    path: agents/academic/abstract_agent.py
    family: academic
    capability: literature_search
    tier: beta
    mission_pack: paper_writing
    artifact_type: report
    is_routed: true
    role: academic_expert

  - agent_id: citation_context
