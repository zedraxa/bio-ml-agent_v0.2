name: Bio-ML Agent CI

on:
  push:
    branches: [ main, experimental, copilot/* ]
  pull_request:
    branches: [ main, experimental ]

permissions:
  contents: read

jobs:
  # ── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        # Select only critical correctness rules (matches flake8 scope in ci.yml)
        # E9xx: syntax errors, F63x/F7x/F82x: undefined names, dead code, etc.
        run: ruff check src/ --select E9,F63,F7,F82 --ignore F824 --output-format github

  # ── 2. Full Test Suite ─────────────────────────────────────
  test:
    name: Tests (459 suite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install core + optional dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui,ml_ops,cloud,viz,xai,whatsapp,test]"
          pip install shap lime playwright flask-limiter twilio

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run full test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest tests/ \
            --ignore=tests/legacy \
            --ignore=tests/benchmarks \
            -q --tb=short \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ── 3. Smoke + Integration ─────────────────────────────────
  smoke:
    name: Smoke & Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui,ml_ops,cloud,viz,test]"

      - name: Smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest tests/test_smoke.py -v --tb=short

      - name: Integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest tests/test_agent_integration.py -v --tb=short

  # ── 4. Secret Scan ─────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Docker Build ────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build . -t bio-ml-agent:test --no-cache
      - name: Verify container starts
        run: |
          docker run --rm -d --name bml-test -p 8001:8001 bio-ml-agent:test
          sleep 8
          curl --fail http://localhost:8001/api/v1/platform/dashboard/summary || true
          docker stop bml-test
